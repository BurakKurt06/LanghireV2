# Version-update pull requests are off (user's decision, 2026-11-01): open-pull-requests-limit 0 on
# every ecosystem. GitHub's Dependabot security alerts are a repository setting and stay on, and the
# CI dependency audit (scripts/audit-dependencies.py, npm audit) still fails on known advisories.
# Updates are done in one tested batch when asked.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Lint tooling held back on purpose (dev-only; the app doesn't ship it):
    # - eslint-plugin-react-hooks 7.1 adds React Compiler rules that flag 11 working patterns,
    #   and ESLint 10 needs it.
    # - eslint-plugin-react-refresh after 0.5.2 flags the entry file src/main.tsx.
    # - typescript-eslint supports TypeScript below 6.1 only.
    ignore:
      - dependency-name: "eslint-plugin-react-hooks"
        versions: [">=7.1.0"]
      - dependency-name: "eslint-plugin-react-refresh"
        versions: [">0.5.2"]
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      - dependency-name: "@eslint/js"
        versions: [">=10.0.0"]
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
