name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release v<version> (version from src-tauri/tauri.conf.json); off = build only"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          pip install uv
          uv sync --locked

      - name: Build Python backend (PyInstaller, Windows)
        run: powershell -ExecutionPolicy Bypass -File scripts/build-backend.ps1

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        with:
          # A release for a v* tag push, or a manual run with "release" ticked (tag v<version>, made
          # on this commit; __VERSION__ is the app's version). Otherwise a manual run only builds
          # (its installer is uploaded below) instead of drafting a release named after the branch.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (inputs.release && 'v__VERSION__' || '') }}
          releaseName: 'LangHireV2 v__VERSION__'
          releaseBody: |
            ## Download

            | OS | File |
            |----|------|
            | Windows x64 | `.exe` installer |

            ### What's New
            See the [release notes](https://github.com/${{ github.repository }}/releases) for details.

            ### Prerequisites
            - Windows 10 or 11 (x64). Python is bundled; no separate install.
            - The app downloads Chromium (~150 MB) on first launch.
            - An AI provider: an API key (OpenRouter, OpenAI, Anthropic, Gemini, Ollama or Bedrock) or a ChatGPT Plus/Pro plan.
          # Published (not a draft): the README's download link points to the latest release.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LangHireV2-windows-x64-installer
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  # Notify on completion
  notify:
    needs: build-tauri
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows x64 | ${{ needs.build-tauri.result }} |" >> $GITHUB_STEP_SUMMARY
