name: Build & Release

# The README's download link always points to the newest release's LangHireV2-setup.exe.
#
# - Automatic: on the public repository, when the Integration Tests run for a push to main
#   passes and the app's version (src-tauri/tauri.conf.json) has no release yet, the installer
#   is built from exactly that tested commit and published as release v<version>. Raising the
#   version is what ships a new installer; pushes that keep the version build nothing.
# - Manual: a run from the Actions page builds the installer (a 7-day download on the run's
#   page); with "release" ticked it also publishes release v<version>, or updates its files.
# - A pushed v* tag publishes that release, as before.

on:
  workflow_run:
    workflows: [Integration Tests]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: "Publish release v<version> (version from src-tauri/tauri.conf.json); off = build only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    # Automatic releases only from the public repository, and only after its tests passed on a
    # push to main. The private working repository builds on request only.
    if: >-
      github.event_name != 'workflow_run' || (
        !github.event.repository.private &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success')
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Decide what to build
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT: ${{ inputs.release }}
        run: bash scripts/plan-release.sh "$EVENT" "$REF_NAME" "$RELEASE_INPUT"

  build-tauri:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          pip install uv
          uv sync --locked

      - name: Build Python backend (PyInstaller, Windows)
        run: powershell -ExecutionPolicy Bypass -File scripts/build-backend.ps1

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        with:
          # Build only; the release (with the fixed-name copy the README links to) is published below.
          tagName: ''
          args: --target ${{ matrix.target }}

      - name: Prepare installer files
        shell: bash
        run: bash scripts/prepare-installer-files.sh "src-tauri/target/${{ matrix.target }}/release/bundle/nsis" dist-installer

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LangHireV2-windows-x64-installer
          path: dist-installer/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Publish release
        if: needs.plan.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash scripts/publish-release.sh "${{ needs.plan.outputs.tag }}" "${{ needs.plan.outputs.version }}"
          "${{ needs.plan.outputs.sha }}" dist-installer

  # Notify on completion
  notify:
    needs: [plan, build-tauri]
    runs-on: ubuntu-latest
    if: always() && needs.plan.result == 'success'
    steps:
      - name: Build Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows x64 | ${{ needs.build-tauri.result }} |" >> $GITHUB_STEP_SUMMARY
