name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.label }})

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Node dependencies
        run: npm install

      - name: Install Python dependencies
        run: |
          pip install uv
          uv sync

      - name: Build Python backend (PyInstaller, Windows)
        run: powershell -ExecutionPolicy Bypass -File scripts/build-backend.ps1

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_GA_API_SECRET: ${{ secrets.VITE_GA_API_SECRET }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LangHireV2 ${{ github.ref_name }}'
          releaseBody: |
            ## Download

            | OS | File |
            |----|------|
            | Windows x64 | `.exe` installer |

            ### What's New
            See the [release notes](https://github.com/${{ github.repository }}/releases) for details.

            ### Prerequisites
            - Python 3.13+ installed on your system
            - Run `python -m playwright install chromium` after installing
            - An LLM API key (OpenAI, Anthropic, or AWS Bedrock)
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

  # Notify on completion
  notify:
    needs: build-tauri
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows x64 | ${{ needs.build-tauri.result }} |" >> $GITHUB_STEP_SUMMARY
