name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    name: Test (${{ matrix.label }})
    # A hung test otherwise runs to GitHub's 6-hour limit (billed at 2x on Windows).
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          pip install uv
          uv sync --locked

      # ── Static Analysis ──────────────────────────────────────────────
      - name: TypeScript type check
        # -b: the root tsconfig only references the app/node/test projects (plain tsc checked no files)
        run: npx tsc -b --noEmit

      - name: ESLint
        run: npx eslint . --max-warnings 0

      - name: Frontend build (Vite)
        run: npm run build

      # ── Unit Tests ───────────────────────────────────────────────────
      - name: Frontend unit tests (Vitest + coverage)
        run: npm run test:coverage

      - name: Backend unit tests (pytest + coverage)
        run: uv run pytest tests/ --cov --cov-report=term-missing --cov-report=xml

      # ── Install Chromium ─────────────────────────────────────────────
      - name: Install Playwright Chromium
        run: uv run python -m playwright install chromium

      - name: Browser preflight (launch only, about:blank)
        timeout-minutes: 10
        run: uv run --locked python scripts/browser-preflight.py

      - name: Browser security regressions (local pages and fake LLM only)
        # 257 cases take ~20 min; faulthandler prints where a stuck test is waiting, and
        # --maxfail stops a broken browser setup early so the errors are printed in time.
        timeout-minutes: 60
        env:
          LANGHIRE_REAL_BROWSER: '1'
        run: uv run --locked pytest -o faulthandler_timeout=300 --maxfail=5 tests/backend/cli/test_submit_guard_live.py tests/backend/cli/test_review_round5_live.py tests/backend/core/test_browser_network_live.py tests/backend/core/test_browser_lifecycle_live.py tests/backend/core/test_trial_action_mode_live.py tests/backend/core/test_request_gate_live.py tests/backend/core/test_application_pipeline_live.py tests/backend/core/test_application_compat_live.py tests/backend/core/test_trial_no_send_live.py tests/backend/core/test_trial_ats_live.py tests/backend/core/test_trial_identity_live.py tests/backend/core/test_trial_vendors_live.py tests/backend/core/test_vendor_scope_live.py tests/backend/cli/test_collect_quick_live.py tests/backend/cli/test_collect_review_1018_live.py tests/backend/cli/test_collect_remaining_live.py tests/backend/cli/test_collection_login_live.py -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning

      - name: Dependency advisories (locked Python and active Windows Rust graph)
        run: uv run --locked python scripts/audit-dependencies.py

      - name: Desktop dependency audit
        run: npm audit --audit-level=low

      - name: Website dependency audit and build
        working-directory: website
        run: |
          npm ci
          npm audit --audit-level=low
          npm run build

      # ── Integration Tests (Source) ───────────────────────────────────
      - name: Run integration tests (source)
        env:
          TEST_OPENROUTER_API_KEY: ${{ secrets.TEST_OPENROUTER_API_KEY }}
        run: uv run python scripts/integration-test.py

      # ── Build Backend Binary ─────────────────────────────────────────
      - name: Build backend binary (Windows)
        run: powershell -ExecutionPolicy Bypass -File scripts/build-backend.ps1

      # ── Integration Tests (Built Binary) ─────────────────────────────
      - name: Run integration tests (binary, Windows)
        env:
          TEST_OPENROUTER_API_KEY: ${{ secrets.TEST_OPENROUTER_API_KEY }}
        run: |
          uv run python scripts/integration-test.py --binary src-tauri/binaries/langhirev2-backend-${{ matrix.target }}.exe

      - name: Frozen backend authentication, Host and request approval checks
        run: uv run --locked python scripts/smoke-backend.py --binary src-tauri/binaries/langhirev2-backend-${{ matrix.target }}.exe

  summary:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Test Summary
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "✅ All integration tests passed on all platforms"
          else
            echo "❌ Some integration tests failed"
            exit 1
          fi
