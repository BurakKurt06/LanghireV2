[project]
name = "job-applicant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "2captcha-python>=1.2.0",
    "boto3>=1.42.84",
    "browser-use>=0.13.10,<0.14",
    "fastapi>=0.135.3",
    "filelock>=3.25.2",
    "langchain-aws>=1.4.3",
    "langchain-core>=1.2.28",
    "langchain-google-genai>=4.2.5",
    "langchain-openai>=1.1.9",
    "playwright>=1.58.0",
    "pyinstaller>=6.19.0",
    "pymupdf>=1.27.2.2",
    "pyyaml>=6.0.1",
    "uvicorn>=0.44.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
# browser-use's exact transitive pins still select known vulnerable releases.
# These patched versions are exercised by the full backend and live-browser suite.
override-dependencies = [
    "aiohttp>=3.14.4,<4",
    "certifi>=2026.10.19",
    "pillow>=13.0.0,<14",
    "anyio>=4.14.2,<5",
    "pypdf>=6.21.2,<7",
    "mcp>=2.2.0,<3",
    "oauthlib>=4.0.0,<5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
